info:
  name: signup
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/signup
  body:
    type: json
    data: |-
      {
        "name": "test",
        "lastName": "test",
        "email": "test@test.com",
        "password": "1234567890"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
