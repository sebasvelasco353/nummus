info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/login
  body:
    type: json
    data: |-
      {
        "email": "test@test.com",
        "password": "1234567890"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("accessToken", res.body.data.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
